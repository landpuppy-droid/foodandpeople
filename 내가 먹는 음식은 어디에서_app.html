          { role: '식재료 배송 기사', type: 'direct', desc: '마트에서 집 앞까지 안전하게 식재료를 배달합니다.' },

          { name: '토마토 페이스트', origin: '미국 (캘리포니아)', distance: 9600, lat: 36.7783, lng: -119.4179, icon: '🍅' },
          { name: '자오 새우', origin: '베트남', distance: 3100, lat: 14.0583, lng: 108.2772, icon: '🍤' },
          { name: '올리브유', origin: '스페인', distance: 9800, lat: 40.4168, lng: -3.7038, icon: '🫒' },

        ],
        people: [

          { role: '해양 양식업자 (베트남)', type: 'direct', desc: '친환경 환경에서 새우를 키우고 수확합니다.' },

          { role: '식품 가공 공장 연구원', type: 'indirect', desc: '토마토 페이스트의 변질을 막는 보존 기술을 연구합니다.' },
          { role: '부산항 컨테이너 크레인 기사', type: 'indirect', desc: '입항한 수입 물동량을 안전하게 하역합니다.' },
          { role: '대형마트 유통 기획자(MD)', type: 'indirect', desc: '전 세계 질 좋은 식재료를 수입하여 매장에 공급합니다.' }
        ]
      },
      {
        id: 'maratang',
        title: '마라탕 & 꿔바로우',

        image: '🍲',

        dishes: [

        ],
        ingredients: [
          { name: '양고기', origin: '호주', distance: 8300, lat: -25.2744, lng: 133.7751, icon: '🥩' },

          { name: '청경채', origin: '대한민국 (경기 용인)', distance: 50, lat: 37.2411, lng: 127.1776, icon: '🥬' },
          { name: '마라 소스 (화죠/마죠)', origin: '중국 (사천)', distance: 2600, lat: 30.5728, lng: 104.0668, icon: '🌶️' }
        ],
        people: [
          { role: '목장 관리자 (호주)', type: 'direct', desc: '넓은 초지에서 양들을 방목하여 키웁니다.' },
          { role: '향신료 가공 기술자 (중국)', type: 'direct', desc: '화죠와 마죠를 조합하여 마라 향신료를 제조합니다.' },
          { role: '채소 하우스 농부 (용인)', type: 'direct', desc: '신선한 청경채를 매일 새벽 수확합니다.' },
          { role: '식약처 통관 위생 검사관', type: 'indirect', desc: '수입 향신료의 안전성을 정밀 검사합니다.' },
          { role: '마라탕 전문점 셰프', type: 'direct', desc: '손님이 선택한 재료를 육수에 맛있게 끓여냅니다.' }
        ]
      }
    ];

    function App() {
      // Step control: 1(밥상 차리기), 2(원산지 지도), 3(사람들 마인드맵), 4(성찰 & 리포트)
      const [currentStep, setCurrentStep] = useState(1);
      
      // Selected or customized meal data
      const [mealData, setMealData] = useState(PRESET_MEALS[0]);
      
      // Custom dish creator modal state
      const [isCustomModalOpen, setIsCustomModalOpen] = useState(false);
      const [customMealTitle, setCustomMealTitle] = useState('');
      const [customIngredientsInput, setCustomIngredientsInput] = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);

      // Student reflection inputs
      const [studentName, setStudentName] = useState('');
      const [schoolClass, setSchoolClass] = useState('');
      const [reflectionText, setReflectionText] = useState('');
      const [selectedRoleDetail, setSelectedRoleDetail] = useState(null);
      const [addedCustomRole, setAddedCustomRole] = useState('');

      // Quiz state
      const [showQuiz, setShowQuiz] = useState(false);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizSubmitted, setQuizSubmitted] = useState(false);

      // Toast Notification
      const [toastMessage, setToastMessage] = useState('');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      // Calculate Total Food Miles
      const totalDistance = useMemo(() => {
        const ingredients = mealData?.ingredients || [];
        return ingredients.reduce((acc, item) => acc + (item?.distance || 0), 0);
      }, [mealData]);

      // Calculate Estimated CO2 (approx 0.12kg CO2 per 1000km transport)
      const estimatedCo2 = useMemo(() => {
        return ((totalDistance * 0.00012)).toFixed(2);
      }, [totalDistance]);

      // Handle Gemini AI Parsing for Custom Meal
      const handleGenerateCustomMeal = async () => {
        if (!customMealTitle.trim()) {
          showToast('음식 이름을 입력해 주세요!');
          return;
        }

        setIsAiLoading(true);
        try {
          const userPrompt = `고등학교 수업용 식재료 원산지 분석:
음식 이름: "${customMealTitle}"
추가 재료 힌트: "${customIngredientsInput}"

다음 형식의 유효한 JSON 객체만 응답하세요. 다른 설명 문구는 절대 금지합니다.
{
  "title": "${customMealTitle}",
  "category": "나만의 맞춤 밥상",
  "image": "🍱",
  "description": "학생이 직접 구상한 특별한 저녁 밥상",
  "dishes": [
    {"name": "${customMealTitle}", "icon": "🍲"}
  ],
  "ingredients": [
    {
      "name": "주재료명",
      "origin": "원산지 국가 또는 국내 지역",
      "distance": 150,
      "lat": 37.5665,
      "lng": 126.9780,
      "icon": "🌾"
    }
  ],
  "people": [
    {
      "role": "직업/역할명",
      "type": "direct",
      "desc": "이 사람이 이 음식에 기여하는 구체적 설명"
    }
  ]
}
최소 4개 이상의 재료와 최소 6명 이상의 직·간접 생산/유통/관련 인물을 포함하세요.`;

          const apiKey = ""; // Gemini API Key will be handled by runtime environment if empty
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userPrompt }] }]
            })
          });

          const data = await res.json();
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

          if (rawText) {
            // Clean codeblock markers if present
            const cleanJson = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
            const parsedData = JSON.parse(cleanJson);
            
            setMealData({
              id: 'custom_' + Date.now(),
              title: parsedData.title || customMealTitle,
              category: parsedData.category || '나만의 맞춤 밥상',
              image: parsedData.image || '🍱',
              description: parsedData.description || '학생이 직접 구상한 특별한 저녁 밥상',
              dishes: Array.isArray(parsedData.dishes) ? parsedData.dishes : [{ name: customMealTitle, icon: '🍲' }],
              ingredients: Array.isArray(parsedData.ingredients) ? parsedData.ingredients : [],
              people: Array.isArray(parsedData.people) ? parsedData.people : []
            });
            setIsCustomModalOpen(false);
            setCustomMealTitle('');
            setCustomIngredientsInput('');
            showToast('✨ AI가 식재료와 연결된 사람들을 자동으로 분석했습니다!');
          } else {
            throw new Error('AI 응답을 불러올 수 없습니다.');
          }
        } catch (err) {
          console.error(err);
          // Fallback manual custom creation if AI call fails
          const fallbackMeal = {
            id: 'custom_' + Date.now(),
            title: customMealTitle,
            category: '나만의 맞춤 밥상',
            image: '🍱',
            description: '학생이 직접 만든 특별한 저녁 메뉴',
            dishes: [{ name: customMealTitle, icon: '🍲' }],
            ingredients: [
              { name: '주재료', origin: '대한민국', distance: 150, lat: 37.5665, lng: 126.9780, icon: '🌾' },
              { name: '양념/수입 재료', origin: '미국', distance: 9500, lat: 37.0902, lng: -95.7129, icon: '🧂' }
            ],
            people: [
              { role: '생산자 (농부/어부)', type: 'direct', desc: '식재료를 정성껏 키우고 수확합니다.' },
              { role: '물류 운송기사', type: 'direct', desc: '집 근처 마트나 유통 센터까지 운송합니다.' },
              { role: '식품 안전 검사관', type: 'indirect', desc: '식재료의 유해 물질 유무를 검사합니다.' },
              { role: '요리 담당자', type: 'direct', desc: '음식을 정성껏 요리합니다.' }
            ]
          };
          setMealData(fallbackMeal);
          setIsCustomModalOpen(false);
          showToast('맞춤 메뉴가 등록되었습니다! (기본 템플릿 적용)');
        } finally {
          setIsAiLoading(false);
        }
      };

      // Add Custom Person Role to Mindmap
      const handleAddCustomRole = () => {
        if (!addedCustomRole.trim()) return;
        const newPerson = {
          role: addedCustomRole,
          type: 'indirect',
          desc: '학생이 직접 찾아낸 보이지 않는 중요 관계자입니다.'
        };
        setMealData(prev => ({
          ...prev,
          people: [...(prev?.people || []), newPerson]
        }));
        setAddedCustomRole('');
        showToast(`'${addedCustomRole}' 님이 커넥션 맵에 추가되었습니다!`);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 pb-12">
          
          {/* Header Bar */}
          <header className="bg-emerald-700 text-white shadow-md sticky top-0 z-40">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">🌍</span>
                <div>
                  <h1 className="font-bold text-lg leading-tight">오늘 저녁 밥상 지도 & 커넥션 랩</h1>
                  <p className="text-xs text-emerald-200">고등학교 스마트 탐구 실습 웹앱</p>
                </div>
              </div>
              <button 
                onClick={() => setShowQuiz(!showQuiz)}
                className="bg-emerald-800 hover:bg-emerald-900 text-emerald-100 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition"
              >
                <i className="fa-solid font-bold text-amber-300 fa-lightbulb"></i>
                <span>생태 퀴즈</span>
              </button>
            </div>

            {/* Step Wizard Bar */}
            <div className="bg-emerald-800/80 backdrop-blur border-t border-emerald-600/50">
              <div className="max-w-5xl mx-auto px-2 py-2 flex justify-between items-center text-xs sm:text-sm font-medium">
                {[
                  { step: 1, label: '1. 밥상 차리기', icon: 'fa-utensils' },
                  { step: 2, label: '2. 원산지 지도', icon: 'fa-earth-americas' },
                  { step: 3, label: '3. 커넥션 맵', icon: 'fa-people-group' },
                  { step: 4, label: '4. 성찰 & 리포트', icon: 'fa-file-lines' },
                ].map((item) => (
                  <button
                    key={item.step}
                    onClick={() => setCurrentStep(item.step)}
                    className={`flex-1 py-2 px-1 text-center flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 transition rounded-md ${
                      currentStep === item.step 
                        ? 'bg-white text-emerald-900 font-bold shadow-sm' 
                        : 'text-emerald-100 hover:bg-emerald-700/50'
                    }`}
                  >
                    <i className={`fa-solid ${item.icon}`}></i>
                    <span className="truncate">{item.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-5xl mx-auto w-full px-4 pt-6 flex-1">
            
            {/* Toast Floating Alert */}
            {toastMessage && (
              <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 animate-bounce text-sm">
                <i className="fa-solid fa-circle-check text-emerald-400"></i>
                <span>{toastMessage}</span>
              </div>
            )}

            {/* STEP 1: 밥상 차리기 */}
            {currentStep === 1 && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                    <div>
                      <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <span className="bg-emerald-100 text-emerald-700 p-2 rounded-xl text-lg">🍽️</span>
                        오늘 저녁 먹고 싶은 밥상을 선택하거나 만들어 보세요
                      </h2>
                      <p className="text-xs sm:text-sm text-slate-500 mt-1">
                        추천 상차림 메뉴를 고르거나, AI 지원을 이용해 나만의 음식을 직접 구성할 수 있습니다.
                      </p>
                    </div>
                    <button
                      onClick={() => setIsCustomModalOpen(true)}
                      className="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 shadow-md transition"
                    >
                      <i className="fa-solid fa-wand-magic-sparkles"></i>
                      <span>나만의 밥상 직접 만들기</span>
                    </button>
                  </div>

                  {/* Preset Meal Cards Grid */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                    {PRESET_MEALS.map((meal) => {
                      const isSelected = mealData.id === meal.id;
                      return (
                        <div
                          key={meal.id}

                    <div className="text-right text-xs text-slate-300 font-mono">
                      <div>탐구자: {schoolClass || '○○고등학교'} {studentName || '학생'}</div>
                      <div>작성일: {new Date().toLocaleDateString('ko-KR')}</div>
                    </div>
                  </div>

                  {/* Summary Metric Stats Grid */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                    <div className="bg-white/10 backdrop-blur p-3 rounded-xl border border-white/10 text-center">
                      <div className="text-[11px] text-slate-300">메뉴 품목</div>
                      <div className="text-lg font-bold text-amber-300">{(mealData.dishes || []).length}개 요리</div>
                    </div>
                    <div className="bg-white/10 backdrop-blur p-3 rounded-xl border border-white/10 text-center">
                      <div className="text-[11px] text-slate-300">식재료 수</div>
                      <div className="text-lg font-bold text-emerald-300">{(mealData.ingredients || []).length}개 품목</div>
                    </div>
                    <div className="bg-white/10 backdrop-blur p-3 rounded-xl border border-white/10 text-center">
                      <div className="text-[11px] text-slate-300">푸드 마일리지</div>
                      <div className="text-lg font-bold text-cyan-300">{totalDistance.toLocaleString()} km</div>
                    </div>
                    <div className="bg-white/10 backdrop-blur p-3 rounded-xl border border-white/10 text-center">
                      <div className="text-[11px] text-slate-300">연결된 사람</div>
                      <div className="text-lg font-bold text-purple-300">{(mealData.people || []).length}명 탐색</div>
                    </div>
                  </div>

                  {/* Ingredient & People Summary Section */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                      <h4 className="text-xs font-bold text-emerald-400 mb-2 flex items-center gap-1.5">
                        <i className="fa-solid fa-earth-americas"></i> 주요 식재료 원산지
                      </h4>
                      <ul className="space-y-1.5 text-xs text-slate-200">
                        {(mealData.ingredients || []).map((ing, i) => (
                          <li key={i} className="flex justify-between border-b border-slate-800/80 pb-1">
                            <span>{ing.icon} {ing.name}</span>
                            <span className="text-slate-400">{ing.origin} ({(ing.distance || 0).toLocaleString()}km)</span>
                          </li>
                        ))}
                      </ul>
                    </div>

                    <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                      <h4 className="text-xs font-bold text-amber-400 mb-2 flex items-center gap-1.5">
                        <i className="fa-solid fa-people-arrows"></i> 연결된 핵심 생산·유통자
                      </h4>
                      <div className="flex flex-wrap gap-1.5 text-xs">
                        {(mealData.people || []).map((p, i) => (
                          <span key={i} className={`px-2 py-0.5 rounded ${
                            p.type === 'direct' ? 'bg-emerald-900/80 text-emerald-200 border border-emerald-700/50' : 'bg-indigo-900/80 text-indigo-200 border border-indigo-700/50'
                          }`}>
                            {p.role}
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Student Written Reflection Display */}
                  <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-800">
                    <h4 className="text-xs font-bold text-teal-300 mb-1 flex items-center gap-1.5">
                      <i className="fa-solid fa-quote-left"></i> 학생 성찰 및 다짐
                    </h4>
                    <p className="text-xs text-slate-200 leading-relaxed whitespace-pre-wrap italic">
                      {reflectionText || '아직 성찰 내용을 입력하지 않았습니다. 상단 입력창에 소감을 적어주세요.'}
                    </p>
                  </div>
                </div>

                {/* Print & Action Controls */}
                <div className="flex flex-col sm:flex-row gap-3 justify-end">
                  <button
                    onClick={() => {
                      window.print();
                    }}
                    className="bg-slate-800 hover:bg-slate-900 text-white font-bold px-5 py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow"
                  >
                    <i className="fa-solid fa-print"></i>
                    <span>리포트 인쇄 / PDF 저장</span>
                  </button>
                  <button
                    onClick={() => {
                      const shareText = `[오늘 저녁 밥상 지도 탐구]\n메뉴: ${mealData.title}\n총 푸드 마일리지: ${totalDistance.toLocaleString()}km\n연결된 사람: ${mealData.people.length}명`;
                      if (navigator.clipboard) {
                        navigator.clipboard.writeText(shareText);
                        showToast('클립보드에 요약 정보가 복사되었습니다!');
                      }
                    }}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow-md"
                  >
                    <i className="fa-solid fa-share-nodes"></i>
                    <span>결과 요약 복사하기</span>
                  </button>
                </div>

              </div>
            )}

          </main>

          {/* Custom Meal Creator Modal (Gemini Powered) */}
          {isCustomModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 overflow-hidden animate-in fade-in zoom-in duration-200">
                <div className="bg-gradient-to-r from-amber-500 to-orange-500 p-4 text-white flex justify-between items-center">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <i className="fa-solid fa-wand-magic-sparkles"></i>
                    나만의 밥상 직접 만들기
                  </h3>
                  <button onClick={() => setIsCustomModalOpen(false)} className="text-white/80 hover:text-white text-lg">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="p-5 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">먹고 싶은 음식을 입력하세요 *</label>
                    <input
                      type="text"
                      placeholder="예: 마라탕, 초밥 세트, 치킨과 콜라"
                      value={customMealTitle}
                      onChange={(e) => setCustomMealTitle(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">주요 식재료 힌트 (선택사항)</label>
                    <input
                      type="text"
                      placeholder="예: 닭고기(국산), 오이, 올리브유"
                      value={customIngredientsInput}
                      onChange={(e) => setCustomIngredientsInput(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div className="p-3 bg-amber-50 rounded-xl border border-amber-200/60 text-[11px] text-amber-800 flex items-start gap-2">
                    <i className="fa-solid fa-circle-info text-amber-600 mt-0.5"></i>
                    <span>AI가 해당 음식의 식재료 원산지, 푸드 마일리지, 생산 유통 관계자를 자동으로 분석합니다.</span>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      onClick={() => setIsCustomModalOpen(false)}
                      className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-medium"
                    >
                      취소
                    </button>
                    <button
                      onClick={handleGenerateCustomMeal}
                      disabled={isAiLoading}
                      className="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow"
                    >
                      {isAiLoading ? (
                        <>
                          <i className="fa-solid fa-spinner animate-spin"></i>
                          <span>AI 분석 중...</span>
                        </>
                      ) : (
                        <>
                          <i className="fa-solid fa-bolt"></i>
                          <span>밥상 생성하기</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Role Detail Modal */}
          {selectedRoleDetail && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5 border border-slate-200 text-slate-800">
                <div className="flex justify-between items-start mb-3">
                  <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${
                    selectedRoleDetail.type === 'direct' ? 'bg-emerald-100 text-emerald-800' : 'bg-indigo-100 text-indigo-800'
                  }`}>
                    {selectedRoleDetail.type === 'direct' ? '직접 생산/유통자' : '간접 지원/기여자'}
                  </span>
                  <button onClick={() => setSelectedRoleDetail(null)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <h3 className="font-extrabold text-base text-slate-800 mb-2">{selectedRoleDetail.role}</h3>
                <p className="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                  {selectedRoleDetail.desc}
                </p>

                <div className="mt-4 flex justify-end">
                  <button
                    onClick={() => setSelectedRoleDetail(null)}
                    className="bg-slate-800 text-white text-xs px-4 py-2 rounded-xl font-semibold"
                  >
                    확인
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Sustainability Quiz Modal */}
          {showQuiz && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
                <div className="bg-emerald-700 p-4 text-white flex justify-between items-center">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <i className="fa-solid fa-lightbulb text-amber-300"></i>
                    식재료 & 푸드 마일리지 실시간 퀴즈
                  </h3>
                  <button onClick={() => setShowQuiz(false)} className="text-white/80 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="p-5 space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar text-xs text-slate-700">
                  
                  {/* Question 1 */}
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <p className="font-bold text-slate-800 mb-2">Q1. '푸드 마일리지(Food Mileage)'의 올바른 정의는 무엇일까요?</p>
                    <div className="space-y-1.5">
                      {[
                        { id: 'q1_a', text: '식재료의 무게(t) × 이동 거리(km)' },
                        { id: 'q1_b', text: '음식을 만드는 데 걸리는 총 시간' },
                        { id: 'q1_c', text: '배달 앱으로 수령한 쿠폰 포인트' }
                      ].map((opt) => (
                        <label key={opt.id} className="flex items-center gap-2 cursor-pointer p-1.5 hover:bg-emerald-50 rounded">
                          <input
                            type="radio"
                            name="q1"
                            onChange={() => setQuizAnswers({...quizAnswers, q1: opt.id})}
                          />
                          <span>{opt.text}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* Question 2 */}
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <p className="font-bold text-slate-800 mb-2">Q2. 지역 생산 식재료를 적극 활용하는 '로컬푸드 운동'의 주요 이점으로 맞지 않는 것은?</p>
                    <div className="space-y-1.5">
                      {[
                        { id: 'q2_a', text: '장거리 수송에 따른 수송 연료 소모 및 온실가스 배출 감소' },
                        { id: 'q2_b', text: '지역 농가 소득 창출 및 생산자와 소비자 간 신뢰 형성' },
                        { id: 'q2_c', text: '식재료의 국제 유통 거리와 이산화탄소 배출량의 폭발적 증가' }
                      ].map((opt) => (
                        <label key={opt.id} className="flex items-center gap-2 cursor-pointer p-1.5 hover:bg-emerald-50 rounded">
                          <input
                            type="radio"
                            name="q2"
                            onChange={() => setQuizAnswers({...quizAnswers, q2: opt.id})}
                          />
                          <span>{opt.text}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  {quizSubmitted && (
                    <div className="p-3 bg-emerald-100 text-emerald-900 rounded-xl font-bold text-center">
                      {quizAnswers.q1 === 'q1_a' && quizAnswers.q2 === 'q2_c' ? (
                        <span>🎉 정답입니다! 푸드 마일리지와 로컬푸드의 핵심 가치를 완벽히 이해하셨습니다!</span>
                      ) : (
                        <span>💡 다시 한번 생각해보세요! (힌트: Q1은 무게x거리, Q2는 오답 고르기)</span>
                      )}
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      onClick={() => setQuizSubmitted(true)}
                      className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow"
                    >
                      정답 제출하기
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
